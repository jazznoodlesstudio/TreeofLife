<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>生命樹 · 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>
:root{
  --night:#0B1426; --ink:#E9EEF6; --muted:#9BA9C2; --line:rgba(255,255,255,.14);
  --lamp:#F6E7A8; --accent:#F2D27A; --accent-ink:#1A1608; --glass:rgba(13,22,42,.72);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;overflow:hidden}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(3,6,16,.6) 100%)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  transition:opacity .8s ease}
.hud.hide{opacity:0}
.hud.hide *{pointer-events:none!important}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brand h1{font-family:var(--f-display);font-size:clamp(24px,3.6vw,34px);letter-spacing:.16em;margin:0;line-height:1.2;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.brand p{margin:6px 0 0;font-family:var(--f-display);font-size:13.5px;color:var(--lamp);opacity:.85;letter-spacing:.06em;max-width:30ch;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.legend{list-style:none;margin:0;padding:10px 14px;display:flex;flex-direction:column;gap:3px;background:var(--glass);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);font-size:12.5px}
.legend li{display:flex;align-items:center;gap:8px;white-space:nowrap;color:var(--muted);transition:color 1.5s}
.legend li.on{color:var(--ink)}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.3;transition:opacity 1.5s,box-shadow 1.5s}
.legend li.on i{opacity:1;box-shadow:0 0 10px var(--c)}
.legend b{font-family:var(--f-display);font-weight:500;min-width:2.2em}
.legend span{font-size:11.5px;opacity:.8}
@media (max-width:720px){.legend{display:none}}

.bottom{display:flex;flex-direction:column;align-items:center;gap:14px}
.caption{min-height:1.8em;font-family:var(--f-display);font-size:clamp(15px,2.2vw,18px);letter-spacing:.08em;color:var(--lamp);text-align:center;
  text-shadow:0 2px 18px rgba(0,0,0,.85);opacity:0;transform:translateY(6px);transition:opacity 1.6s ease,transform 1.6s ease}
.caption.show{opacity:1;transform:none}
.primary{pointer-events:auto;border:0;border-radius:99px;padding:13px 34px;font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:.14em;
  background:linear-gradient(180deg,#F8E3A0,#EBC466);color:var(--accent-ink);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 10px 40px -8px rgba(242,210,122,.55);
  transition:transform .25s ease,box-shadow .25s ease}
.primary:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 14px 48px -6px rgba(242,210,122,.75)}
.primary,.demo{transition:opacity .8s ease,transform .25s ease,box-shadow .25s ease}
.hud.busy .primary,.hud.busy .demo{opacity:0;pointer-events:none}
.demo{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.demo button{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:4px 13px;color:var(--muted);backdrop-filter:blur(8px);transition:color .2s,border-color .2s}
.demo button:hover{color:var(--ink);border-color:rgba(255,255,255,.35)}

/* 選果子 */
.picker{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .7s ease}
.picker.open{opacity:1}
.picker header{position:absolute;top:max(22px,env(safe-area-inset-top));left:0;right:0;text-align:center;padding:0 56px}
.picker h2{font-family:var(--f-display);font-size:clamp(19px,3vw,26px);letter-spacing:.1em;margin:0}
.picker header p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.close{position:absolute;top:max(18px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:18px;line-height:1}
.picker.open .close,.picker.open .lab,.picker.open .skip,.picker.open .card.show{pointer-events:auto}
.lab{position:absolute;left:0;top:0;border:0;background:none;padding:4px 10px;text-align:center;line-height:1.3;transform:translate(-50%,0);border-radius:10px;white-space:nowrap}
.lab b{display:block;font-family:var(--f-display);font-size:clamp(14px,2vw,17px);letter-spacing:.12em;text-shadow:0 1px 10px #000}
.lab span{display:block;font-size:11px;color:var(--muted);text-shadow:0 1px 8px #000}
.lab.sel b{color:var(--lamp)}
.lab.dim{opacity:.45}
.picker.has-sel .lab{opacity:0;pointer-events:none!important}
.picker.has-sel header p{display:none}
.lab{transition:opacity .4s}
.skip{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);border:0;background:none;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:4px;padding:8px 12px;transition:opacity .4s}
.card{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));width:min(540px,calc(100% - 24px));transform:translate(-50%,24px);opacity:0;
  background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px 18px 16px;backdrop-filter:blur(14px);
  transition:opacity .5s ease,transform .5s ease;display:flex;flex-direction:column;gap:10px}
.card.show{opacity:1;transform:translate(-50%,0)}
.card{max-height:calc(100dvh - 150px);overflow:auto}
.card h3{margin:0;font-family:var(--f-display);font-size:21px;letter-spacing:.12em;display:flex;align-items:baseline;gap:10px}
.card h3 i{width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);align-self:center}
.card h3 small{font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--muted);letter-spacing:.06em}
.card p{margin:0;font-size:14px;color:#D5DDEB}
.card .q{font-family:var(--f-display);color:var(--lamp);font-size:14.5px}
.card .lbl{font-size:11.5px;color:var(--muted);letter-spacing:.1em}
.chips{display:flex;flex-direction:column;gap:6px}
.chips button{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:12px;padding:6px 12px;font-size:13.5px;color:#D5DDEB;transition:border-color .2s,background .2s}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:rgba(242,210,122,.12);color:var(--ink)}
.card .go{align-self:stretch;border:0;border-radius:99px;padding:10px 20px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.14em;background:linear-gradient(180deg,#F8E3A0,#EBC466);color:var(--accent-ink);margin-top:2px}
@media (max-height:640px){.card p.desc{display:none}}
.cgo{position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;border:0;border-radius:99px;padding:12px 40px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.14em;background:linear-gradient(180deg,#F8E3A0,#EBC466);color:var(--accent-ink);transition:opacity .4s,transform .4s;white-space:nowrap}
.picker.open .cgo.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
/* 省思步驟 */
.flow{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;opacity:0;transition:opacity .6s ease;
  padding:0 12px max(18px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(4,8,18,.82),rgba(4,8,18,.25) 62%,rgba(4,8,18,0))}
.flow.open{opacity:1;pointer-events:auto}
.fcard{width:min(560px,100%);background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:18px 20px 16px;backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:12px;
  transform:translateY(18px);transition:transform .6s ease;max-height:calc(100dvh - 90px);overflow:auto}
.flow.open .fcard{transform:none}
.fdots{display:flex;gap:6px}
.fdots i{width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.16);transition:background .4s}
.fdots i.on{background:var(--accent)}
.fcard h2{margin:0;font-family:var(--f-display);font-size:clamp(19px,2.8vw,23px);letter-spacing:.06em;line-height:1.5;text-wrap:balance}
.fsub{margin:-6px 0 0;font-size:13.5px;color:var(--muted)}
.fcard textarea,.fcard input[type=text],.card input[type=text]{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:10px 14px;resize:none}
.fcard textarea:focus,.fcard input:focus,.card input:focus{outline:2px solid var(--accent);outline-offset:1px}
.fcard ::placeholder,.card ::placeholder{color:rgba(155,169,194,.7)}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchips button,.fopts button{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:99px;padding:6px 15px;font-size:14.5px;color:#D5DDEB;transition:border-color .2s,background .2s,color .2s}
.fopts{display:flex;flex-direction:column;gap:8px}
.fopts button{border-radius:14px;text-align:left;padding:10px 16px;font-size:15px}
.fopts button small{display:block;font-size:12.5px;color:var(--muted)}
.fchips button[aria-pressed="true"],.fopts button[aria-pressed="true"]{border-color:var(--accent);background:rgba(242,210,122,.13);color:var(--ink)}
.fnav{display:flex;gap:10px;align-items:center;margin-top:2px}
.fnav .ghost{border:0;background:none;color:var(--muted);padding:10px 12px;font-size:14px}
.fnav .go{flex:1;border:0;border-radius:99px;padding:11px 20px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.14em;background:linear-gradient(180deg,#F8E3A0,#EBC466);color:var(--accent-ink);transition:opacity .3s}
.fnav .go:disabled{opacity:.35;cursor:default}
.fnote{font-size:11.5px;color:var(--muted);text-align:center;margin:0}
.flow .close{pointer-events:auto}
/* 選果子時的柔和提示 */
.lab.hint b{text-decoration:underline dashed var(--c);text-underline-offset:6px;text-decoration-thickness:1.5px}
.lab.last b::after{content:"上次";font-family:var(--f-body);font-size:10px;letter-spacing:0;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 4px;margin-left:5px;vertical-align:middle}
.err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--muted)}
</style>
</head>
<body>
<canvas id="gl" aria-label="夜色中的生命樹，九種果子在枝條上發光"></canvas>

<div id="vig"></div>
<div class="hud" id="hud">
  <div class="top">
    <div class="brand">
      <h1>生命樹</h1>
      <p>聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。<br>— 加拉太書 5:22-23</p>
    </div>
    <ul class="legend" id="legend" aria-label="九種果子目前的樣子"></ul>
  </div>
  <div class="bottom">
    <div class="caption" id="caption" role="status" aria-live="polite"></div>
    <button class="primary" id="btnReflect">今天的省思</button>
    <div class="demo" aria-label="示範用的時間快轉">
      <span>示範：</span>
      <button data-adv="7">過一週</button>
      <button data-adv="28">過一個月</button>
      <button id="btnRest">休息兩週</button>
      <button id="btnReset">重新開始</button>
      <button id="btnChar">換夥伴</button>
    </div>
  </div>
</div>

<div class="picker" id="picker" aria-hidden="true">
  <header>
    <h2>今天，想留意哪一種果子？</h2>
    <p id="pkSub">只選一種就好。轉一轉、看一看，再決定。</p>
  </header>
  <button class="close" id="btnClose" aria-label="關閉">✕</button>
  <div id="labels"></div>
  <button class="skip" id="btnSkip">今天先不選</button>
  <div class="card" id="card">
    <h3><i></i><span id="cName"></span><small id="cEn"></small></h3>
    <div class="lbl" id="cTree"></div>
    <p class="desc" id="cDesc"></p>
    <p class="q" id="cQ"></p>
    <div class="lbl">明天可以試試</div>
    <div class="chips" id="cChips"></div>
    <input type="text" id="cOwn" placeholder="或寫下你自己的方式（4 個字以上）" maxlength="80" aria-label="自己的實踐方式">
    <div class="fnav"><button class="ghost" id="btnBackPick">換一種</button><button class="go" id="btnGo">完成今天的省思</button></div>
  </div>
</div>
<div class="flow" id="flow" aria-hidden="true">
  <button class="close" id="fClose" aria-label="先離開，稍後再寫">✕</button>
  <div class="fcard" role="dialog" aria-labelledby="fTitle">
    <div class="fdots" id="fDots" aria-hidden="true"></div>
    <h2 id="fTitle"></h2>
    <p class="fsub" id="fSub"></p>
    <div id="fBody"></div>
    <div class="fnav"><button class="ghost" id="fBack">上一步</button><button class="go" id="fNext">下一步</button></div>
    <p class="fnote">寫下的內容只存在這台裝置的瀏覽器裡。</p>
  </div>
</div>
<div class="picker" id="cpicker" aria-hidden="true">
  <header>
    <h2>誰陪你一起照顧這棵樹？</h2>
    <p>牠會替你把今天的果子種下、澆水。之後隨時可以換。</p>
  </header>
  <button class="close" id="btnCClose" aria-label="關閉">✕</button>
  <div id="clabels"></div>
  <button class="cgo" id="btnCGo">就是牠了</button>
</div>
<div class="err" id="err">3D 場景載入失敗（需要網路以載入 three.js）。</div>

<script src="src/data.js"></script>
<script src="src/engine.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ───────── 小工具 ───────── */
const $ = s => document.querySelector(s);
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lerp = THREE.MathUtils.lerp, clamp = THREE.MathUtils.clamp, sstep = THREE.MathUtils.smoothstep;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const D = (v = 0) => ({ v, t: v, vel: 0 });
/* smoothDamp：所有成長都經過它，先慢、再快、再慢，沒有瞬間跳變 */
function sd(o, dt, st = 1.1) {
  const om = 2 / st, x = om * dt, e = 1 / (1 + x + .48 * x * x + .235 * x * x * x);
  const ch = o.v - o.t, tmp = (o.vel + om * ch) * dt;
  o.vel = (o.vel - om * tmp) * e; o.v = o.t + (ch + tmp) * e; return o.v;
}
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const IDS = FRUITS.map(f => f.id);
const GLOW = RULES.visual.glow;

const NOISE = `float h31(vec3 p){ p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float n3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z); }
float fbm(vec3 p){ float a = .5, r = 0.; for (int i = 0; i < 5; i++) { r += a * n3(p); p = p * 2.03 + vec3(1.7); a *= .5; } return r; }
`;

/* ───────── Renderer ───────── */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
const scene = new THREE.Scene();
const FOG = new THREE.Color('#1c3464');
scene.fog = new THREE.FogExp2(FOG, 0.028);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
camera.position.set(7, 2.6, 9);
scene.add(camera);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .06; controls.enablePan = false;
controls.minPolarAngle = 0.95; controls.maxPolarAngle = 1.5;
controls.autoRotate = !REDUCED; controls.autoRotateSpeed = 0.32; controls.rotateSpeed = .5;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.8, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ───────── 天空、星、月 ───────── */
const MOON_DIR = V3(-0.55, 0.42, -0.72).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 48, 32), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#050916') }, mid: { value: new THREE.Color('#0e1c40') }, hor: { value: FOG.clone() }, glow: { value: new THREE.Color('#5a6fb5') }, moon: { value: MOON_DIR }, t: { value: 0 } },
  vertexShader: `varying vec3 d; void main(){ d = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `varying vec3 d; uniform vec3 top, mid, hor, glow, moon; uniform float t;
    ${NOISE}
    void main(){ vec3 n = normalize(d); float h = clamp(n.y, -1., 1.);
      vec3 c = mix(hor, mid, smoothstep(0., .28, h)); c = mix(c, top, smoothstep(.2, .85, h));
      c = mix(c, hor, smoothstep(0., -.08, h));
      // 銀河：一條斜跨天頂的光帶，裡面有塵埃的明暗
      vec3 A = normalize(vec3(.42, .46, -.78)); float bd = dot(n, A), band = exp(-bd * bd / .05), up = smoothstep(.03, .4, h);
      float dust = fbm(n * 5. + 3.), lane = smoothstep(.38, .62, fbm(n * 9. + vec3(8.)));
      c += (vec3(.30, .38, .72) * (.25 + dust) * .30 + vec3(.62, .40, .66) * pow(dust, 3.) * .5) * band * up * (1. - lane * .6);
      c += vec3(.9, .95, 1.) * pow(h31(floor(n * 520.)), 70.) * (.35 + band * 2.2) * up;
      // 薄雲：很慢地飄，朝月亮的那一面被照亮
      vec2 cp = n.xz / (n.y + .32); float cl = fbm(vec3(cp * 1.5 + vec2(t * .007, t * .003), t * .004));
      cl = smoothstep(.48, .8, cl) * smoothstep(.0, .14, h) * (1. - smoothstep(.4, .78, h));
      float m = max(dot(n, moon), 0.);
      c = mix(c, mix(vec3(.07, .11, .24), vec3(.50, .56, .82), pow(m, 3.) * .9 + .1), cl * .6);
      c += glow * (pow(m, 5.) * .12 + pow(m, 60.) * .45);
      gl_FragColor = vec4(c, 1.); }`
}));
scene.add(sky);

function radialTex(stops) {

    const lift = sd(pk.lift, dt, .6); pk.lift.t = pk.sel >= 0 ? 1 : 0;
    const cols = camera.aspect > 1.25 ? 5 : 3, rowsN = Math.ceil(9 / cols);
    const topM = .15, botM = lerp(.12, cardEl.offsetHeight / innerHeight + .05, lift), usable = H * (1 - topM - botM);
    const cell = Math.min(W * .9 / cols, usable / rowsN), cy = H * (.5 - topM) - usable / 2;
    picks.forEach((p, i) => {

      const x = (col - (inRow - 1) / 2) * cell, y = cy + ((rowsN - 1) / 2 - row) * cell + cell * .16;
      // 選定後：只留下那一顆，放大停在卡片上方；其他的退場
      const on = pk.sel === i; p.px.t = on ? 0 : x; p.py.t = on ? cy : y; p.sz.t = on ? clamp(usable * .6, H * .05, H * .17) : cell * .43;
      if (!p.H.visible) { p.px.v = p.px.t; p.py.v = p.py.t; p.sz.v = p.sz.t; }
      p.H.visible = true; p.H.position.set(sd(p.px, dt, .4), sd(p.py, dt, .4) + Math.sin(t * 1.1 + p.ph) * cell * .025, -PD);
      p.sc.t = pf * (on ? 1 : pk.sel >= 0 ? 0 : pk.hover === i ? 1.1 : 1);
      p.H.scale.setScalar(Math.max(sd(p.sc, dt, .35), .001) * sd(p.sz, dt, .4));
      p.model.rotation.y = REDUCED ? .5 : t * (pk.sel === i ? .9 : .45) + p.ph; p.model.rotation.z = Math.sin(t * .8 + p.ph) * .06;
      p.halo.material.opacity = pf * (pk.sel === i ? .5 : pk.sel >= 0 ? .08 : pk.hover === i ? .36 : .2);
      p.mat.emissiveIntensity = pk.sel === i ? .5 : pk.sel >= 0 ? .12 : .3;
      tmp.set(x, y - cell * .3, -PD); camera.localToWorld(tmp).project(camera);

    });
  } else picks.forEach(p => { p.H.visible = false; });

}
function frame() { tick(Math.min(clock.getDelta(), .05)); requestAnimationFrame(frame); }

const restored = load(); if (!restored) reset();
{ let saved = null; try { saved = NOSAVE ? 'rabbit' : localStorage.getItem('tol_char'); } catch (e) {} if (ANIMALS.some(a => a.id === saved)) setActor(saved); else setTimeout(openChar, 1200); }
if (!restored || !refls.length) caption('樹還沒有種下。從今天的省思開始。', 0);
frame();
